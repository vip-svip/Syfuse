name: 功能建议
description: 提出一个能力或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前先看一眼 [README 的 Shadowrocket 功能覆盖表](https://github.com/vipsvip/Syfuse/blob/main/README.md#shadowrocket-功能覆盖表)：
        表里标了「复刻 / 增强 / 不做」三态。标为「不做」的项请在建议里说明
        **为什么你认为当初的判断不成立**，而不是直接重提。

  - type: dropdown
    id: category
    attributes:
      label: 类别
      options:
        - 主干复刻（Shadowrocket 有但我们还没做）
        - 差异增强（Shadowrocket 没有的新能力）
        - 性能
        - 可用性 / 无障碍
        - 安全加固
        - 开发体验 / CI
        - 文档
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述场景，而不是直接描述实现方案。
      placeholder: |
        我在弱网下切换节点时，界面有 2 秒完全没有反馈，不知道是在切换还是卡死了。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 以及为什么不选它们。
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      description: 以下几条是本项目的硬约束，你的建议必须能兼容它们。
      options:
        - label: 我的建议不依赖 WebView（R1：主界面必须原生 Compose）
          required: true
        - label: 我的建议不需要在运行时下载可执行内容（R2：内核静态随包）
          required: true
        - label: 我的建议不引入遥测 / 崩溃上报 / 广告 SDK（R3：零遥测）
          required: true
        - label: 我理解新增依赖需要同步更新 NOTICE，且许可证必须与 GPL-3.0-or-later 兼容
          required: true
