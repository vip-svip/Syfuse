# ============================================================================
#  Syfuse 主配置（syfuse.conf）
#
#  ## 取值来源（重要）
#
#  本文件的**默认值不是随便定的**，而是逐项对齐提示词 6.4「必须沿用的具体参数」——
#  那是复现 SY / SY-Fusion 的硬指标：参数同值才算复现（6.1 四维判定之一）。
#
#  与 6.4 的对应关系逐条写在每个键上方。改默认值前先回去读 6.4，
#  否则会破坏"参数同值"这一维。
#
#  ## 键的并集
#
#  6.4 要求 `syfuse.conf` 必须**同时接受 SY 与 SY-Fusion 的全部键**。
#  遇到只属于其中一个项目的键，**不得报错**——要么生效、要么忽略并记录日志。
#  本文件已包含两者的并集，并标注了每个键的来源。
#
#  ## 解析约定
#
#  `KEY=value`，`#` 开头为注释，值不带引号。
#  未出现在本文件的键取代码内默认值，不报错（前向兼容）。
#  每个键都标注：类型 / 取值范围 / 风险等级 / UI 位置。
# ============================================================================

# ---------- 总开关 ----------
# 6.4 规定：DNS_ENABLE=1、MITM_ENABLE=0、SPLASH_ENABLE=1、NOTIFY_ENABLE=1、
#          PANEL_ENABLE=1、DNSSRV_ENABLE=0、PROXY_ENABLE=0、PROXY_LEAK=0、
#          BLACKLIST_ENABLE=1
# 注意与"安全默认值"直觉相反：DNS/开屏/通知/面板/黑名单**默认开**，
# MITM 与代理**默认关**。这是 6.4 的硬规定（复现原项目行为），不是笔误。
DNS_ENABLE=1
MITM_ENABLE=0
SPLASH_ENABLE=1
NOTIFY_ENABLE=1
PANEL_ENABLE=1

# ---------- DNS 层 ----------
# DNS_UPSTREAM      类型 string  风险 进阶  UI: 设置 → 隐私与防泄漏 → DNS 防泄漏
# DNS_UPSTREAM_ENC  类型 string  风险 进阶
#   6.4 给的是 **URL**（`https://dns.alicdn.com/dns-query`）而不是枚举 ——
#   加密方式由 URL 的 scheme 决定（https=DoH / tls=DoT / quic=DoQ / 纯 IP=明文）。
#   早期版本把它写成 plain/doh/dot/doq 枚举，与 6.4 不符，已改回 URL 形态。
# DNS_AUTO_UPDATE / DNS_UPDATE_INTERVAL  6.4: 24（**单位是小时**）
# DNSSRV_ENABLE     类型 bool  风险 危险（接管 53 端口会影响其他应用）
DNS_UPSTREAM=1.1.1.1
DNS_UPSTREAM_ENC=https://dns.alicdn.com/dns-query
DNS_AUTO_UPDATE=0
DNS_UPDATE_INTERVAL=24
DNSSRV_ENABLE=0

# ---------- MITM 层 ----------
# 6.4: MITM_PORT=8443（HTTPS）、MITM_HTTP_PORT=8080（HTTP）
MITM_PORT=8443
MITM_HTTP_PORT=8080
MITM_APPS=
MITM_QUIC_POLICY=pass

# ---------- 面板与控制 API ----------
# 6.4: PANEL_PORT=8848，访问需 token（http://<手机IP>:8848?token=<令牌>）
PANEL_PORT=8848
API_ENABLE=0

# ---------- 网络代理层 ----------
# 6.4: PROXY_PORT=2080；PROXY_CORE 留空 = 自动探测内置内核（sing-box / xray）；
#      PROXY_SUB_INTERVAL=24（小时）
PROXY_ENABLE=0
PROXY_PORT=2080
PROXY_CORE=
PROXY_LEAK=0
PROXY_SUB_INTERVAL=24

# ---------- 过滤引擎 ----------
# 6.4: BLACKLIST_ENABLE=1
# ENGINE_* 是 SY-Fusion 专有键（6.4 要求取并集，不得因出现而报错）
BLACKLIST_ENABLE=1
ENGINE_HEURISTIC=0
ENGINE_STRICT_SCOPE=1
ENGINE_CLIENT=
ENGINE_CTAG=

# ---------- hosts 与规则源 ----------
# HOSTS_EXTRA 是 SY-Fusion 专有键（额外 hosts 条目，换行用 \n）
HOSTS_EXTRA=
# RULES_REPO 6.4 要求「指向『作者账号/SY-Rules』形态的仓库」。
#   **这里必须留空**：提示词 1.2 禁止硬编码任何具体账号字面量。
#   实际值由 tools/set_owner.sh 在运行时按解析出的账号填入；
#   解析不到时留空并由 UI 提示「规则源未配置」，**不许写占位符**。
RULES_REPO=
RULES_BRANCH=main
RULES_MIRROR=

# ---------- 脚本 ----------
# 6.4: SCRIPT_UPDATE_INTERVAL=24（小时）
SCRIPT_UPDATE_INTERVAL=24

# ---------- 本产品新增 ----------
HOOK_ENABLE=0
HOOK_ENGINE=auto
HOOK_APPS=
LEAK_GUARD=1
LEAK_INSPECT_INTERVAL=30
LEAK_AUTO_FIX=0
SPLASH_ENGINE=hook
NOTIFY_SCOPE=
RESTORE_MANIFEST=/data/adb/syfuse/manifest/installed.json

# ---------- 布局与主题（4.1 / 4.12） ----------
# LAYOUT_PRESET 取值 daily|geek|minimal，默认 geek（4.1：默认布局 B，7 Tab）
LAYOUT_PRESET=geek
# THEME_PRESET 取值为 4.12 的内置方案 id，默认 aurora-glass（极光玻璃）
THEME_PRESET=aurora-glass
