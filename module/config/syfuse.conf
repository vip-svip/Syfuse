# ============================================================================
#  Syfuse 主配置（syfuse.conf）
#
#  设计原则（提示词 16 部分）：
#   - 保留 SY-Fusion 的同名键，向后兼容；
#   - 每个键都有：默认值 / 类型 / 取值范围 / 风险等级 / 对应 UI 位置；
#   - 本文件是**运行时**配置，安装在 /data/adb/syfuse/syfuse.conf；
#     App 的设置页与该文件双向同步（M13 实现双向同步，当前只有文件侧）。
#
#  解析约定：`KEY=value`，`#` 开头为注释，值不带引号。
#  未出现在本文件的键取代码内默认值，不报错（前向兼容）。
# ============================================================================

# ---------- 总开关 ----------
# 类型 bool  取值 0|1  风险 安全  UI: 设置 → 广告与过滤 / 设置 → 脚本与 Hook
DNS_ENABLE=0
MITM_ENABLE=0
SPLASH_ENABLE=0
NOTIFY_ENABLE=0
PANEL_ENABLE=0

# ---------- DNS 层 ----------
# DNS_UPSTREAM      类型 string  风险 进阶  UI: 设置 → 隐私与防泄漏 → DNS 防泄漏
# DNS_UPSTREAM_ENC  类型 enum(plain|doh|dot|doq)  风险 进阶
# DNS_AUTO_UPDATE   类型 bool
# DNS_UPDATE_INTERVAL 类型 int(分钟)  取值 5..10080
# DNSSRV_ENABLE     类型 bool  风险 危险（接管 53 端口会影响其他应用）
DNS_UPSTREAM=1.1.1.1
DNS_UPSTREAM_ENC=plain
DNS_AUTO_UPDATE=0
DNS_UPDATE_INTERVAL=1440
DNSSRV_ENABLE=0

# ---------- MITM 层 ----------
# MITM_PORT / MITM_HTTP_PORT  类型 int  取值 1024..65535  风险 危险
# MITM_APPS  类型 string（逗号分隔包名，空=不启用）  风险 危险
# MITM_QUIC_POLICY 类型 enum(pass|block|mitm)  风险 进阶
MITM_PORT=8443
MITM_HTTP_PORT=8080
MITM_APPS=
MITM_QUIC_POLICY=pass

# ---------- 面板与控制 API ----------
# PANEL_PORT 类型 int  取值 1024..65535  风险 进阶
# API_ENABLE 类型 bool  风险 危险（开放控制通道）
# API_TOKEN  类型 string  **由 syfused 生成后写入 api.token，不写在本文件**
PANEL_PORT=8848
API_ENABLE=0

# ---------- 网络代理层 ----------
# PROXY_ENABLE 类型 bool  风险 安全
# PROXY_PORT   类型 int   取值 1024..65535
# PROXY_CORE   类型 string（内核标识，M3 接入后有效）
# PROXY_LEAK   类型 bool  风险 进阶（节点级防泄漏，对应 SY-Fusion 的 PROXY_LEAK）
# PROXY_SUB_INTERVAL 类型 int(分钟)
PROXY_ENABLE=0
PROXY_PORT=2080
PROXY_CORE=
PROXY_LEAK=1
PROXY_SUB_INTERVAL=1440

# ---------- 过滤引擎 ----------
# BLACKLIST_ENABLE   类型 bool  风险 安全
# ENGINE_HEURISTIC   类型 bool  风险 进阶（启发式匹配，可能误拦）
# ENGINE_STRICT_SCOPE 类型 bool 风险 进阶
# ENGINE_CLIENT / ENGINE_CTAG  类型 string（对应 $client= / $ctag=）
BLACKLIST_ENABLE=0
ENGINE_HEURISTIC=0
ENGINE_STRICT_SCOPE=1
ENGINE_CLIENT=
ENGINE_CTAG=

# ---------- hosts 与规则源 ----------
# HOSTS_EXTRA  类型 string（额外 hosts 条目，换行用 \n）
# RULES_REPO / RULES_BRANCH / RULES_MIRROR  类型 string
HOSTS_EXTRA=
RULES_REPO=
RULES_BRANCH=main
RULES_MIRROR=

# ---------- 脚本 ----------
# SCRIPT_UPDATE_INTERVAL 类型 int(分钟)
SCRIPT_UPDATE_INTERVAL=1440

# ---------- 本产品新增 ----------
# HOOK_ENABLE  类型 bool  风险 危险（会修改其他应用行为）
# HOOK_ENGINE  类型 enum(auto|zygisk|lsposed|apatch|ldpreload|ptrace)
# HOOK_APPS    类型 string（逗号分隔包名；**默认空 = 不 Hook 任何应用**）
# LEAK_GUARD   类型 bool  风险 安全
# LEAK_INSPECT_INTERVAL 类型 int(分钟)
# LEAK_AUTO_FIX 类型 bool  风险 进阶
# SPLASH_ENGINE 类型 enum(hook|a11y)  风险 危险（无障碍会读取屏幕内容）
# NOTIFY_SCOPE  类型 string
# RESTORE_MANIFEST 类型 string（还原清单路径，一般不改）
HOOK_ENABLE=0
HOOK_ENGINE=auto
HOOK_APPS=
LEAK_GUARD=1
LEAK_INSPECT_INTERVAL=30
LEAK_AUTO_FIX=0
SPLASH_ENGINE=hook
NOTIFY_SCOPE=
RESTORE_MANIFEST=/data/adb/syfuse/manifest/installed.json
